[project]
name = "My-Chef"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yassincode20", email = "xistyxistyde@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.53.0",
]

[project.scripts]
my-chef = "my_chef:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
