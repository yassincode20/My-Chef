services:
  db:                                  # replaces: docker run --name mychef-db
    image: postgres:16
    environment:                       # replaces: -e POSTGRES_...
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}    # read from .env
      POSTGRES_DB: mychef
    volumes:                           # replaces: -v mychef-pgdata:...
      - pgdata:/var/lib/postgresql/data
    healthcheck:                       # new: "is Postgres ready yet?"
      test: ["CMD-SHELL", "pg_isready -U postgres -d mychef"]
      interval: 5s
      retries: 10

  api:                                 # replaces: docker run ... mychef-api
    build: .                           # replaces: docker build (uses your Dockerfile)
    ports:                             # replaces: -p 8000:8000
      - "8000:8000"
    env_file: .env                     # replaces: --env-file .env
    environment:                       # replaces: -e DB_URL=...
      DB_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/mychef
    depends_on:                        # start the API only after the DB is healthy
      db:
        condition: service_healthy

volumes:
  pgdata: